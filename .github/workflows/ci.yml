name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only run what a change can affect: docs and site edits skip the host builds.
  changes:
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.f.outputs.host }}
      site: ${{ steps.f.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            host:
              - 'crates/**'
              - 'web/**'
              - 'tests/unit/**'
              - 'Cargo.*'
              - '.github/workflows/**'
            site:
              - 'site/**'
              - 'web/**'
              - 'tests/site/**'
              - '.github/workflows/**'

  # Build and unit tests on each OS (host.yml). The browser e2e suite runs locally only.
  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.host == 'true'
    uses: ./.github/workflows/host.yml
    with: { os: macos-latest }

  linux:
    name: Linux
    needs: changes
    if: needs.changes.outputs.host == 'true'
    uses: ./.github/workflows/host.yml
    with: { os: ubuntu-latest }

  windows:
    name: Windows
    needs: changes
    if: needs.changes.outputs.host == 'true'
    uses: ./.github/workflows/host.yml
    with: { os: windows-latest }

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    name: Site and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: site/package-lock.json }
      - working-directory: site
        run: npm ci --no-audit --no-fund
      - run: node --test tests/site/site.test.mjs
      - run: node --test tests/site/accounts.test.mjs
