name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Only run what a change can affect: docs and site edits skip the host builds.
  changes:
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.f.outputs.host }}
      site: ${{ steps.f.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            host:
              - 'crates/**'
              - 'web/**'
              - 'tests/e2e/**'
              - 'tests/unit/**'
              - 'site/src/**'
              - 'site/package*.json'
              - 'Cargo.*'
              - '.github/workflows/**'
            site:
              - 'site/**'
              - 'web/**'
              - 'tests/site/**'
              - '.github/workflows/**'

  # Each OS builds once, then its e2e shards start as soon as its own build is done (Linux
  # doesn't wait for the slower macOS build). Both use the reusable workflow below.
  macos:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    uses: ./.github/workflows/host.yml
    with: { os: macos-latest, name: macOS }

  linux:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    uses: ./.github/workflows/host.yml
    with: { os: ubuntu-latest, name: Linux }

  site:
              - 'site/**'
              - 'web/**'
              - 'tests/site/**'
              - '.github/workflows/**'

  build:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    name: ${{ matrix.name }} build + unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macOS }
          - { os: ubuntu-latest, name: Linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libclang-dev pkg-config nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per OS, shared by every branch; only main writes it, so PRs start
          # warm and the cache never fills up with branch copies.
          shared-key: ci-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --profile $CARGO_PROFILE
      - run: cargo build --profile $CARGO_PROFILE -p glass-host
      - if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with: { node-version: 24 }
      - if: runner.os == 'Linux'
        run: node --test tests/unit/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: glass-${{ runner.os }}
          path: target/ci/glass-host
          retention-days: 1

  e2e:
    needs: build
    name: ${{ matrix.name }} e2e ${{ matrix.shard }}/3
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        shard: [1, 2, 3]
        include:
          - { os: macos-latest, name: macOS }
          - { os: ubuntu-latest, name: Linux }
    runs-on: ${{ matrix.os }}
    env:
      GLASS_BIN: ${{ github.workspace }}/bin/glass-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: 'glass-${{ runner.os }}', path: bin }
      - run: chmod +x bin/glass-host
      # The binary links PipeWire (screen capture), which the runner doesn't have.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-0t64
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            tests/e2e/package-lock.json
      - name: Site deps (the e2e tests run its introducer locally)
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: End-to-end (Chrome, glass --test)
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          # The runners ship Google Chrome; install it only if this one doesn't.
          if [ "$RUNNER_OS" = Linux ]; then command -v google-chrome || npx playwright install --with-deps chrome; else npx playwright install chrome || true; fi
          npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ runner.os }}-${{ matrix.shard }}
          path: tests/e2e/test-results

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    name: Site and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: site/package-lock.json }
      - working-directory: site
        run: npm ci --no-audit --no-fund
      - run: node --test tests/site/site.test.mjs
