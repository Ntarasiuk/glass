name: Release

# Push a tag like v0.2.0 (matching Cargo.toml) to build, sign and publish a release.
# Run it by hand (Actions › Release › Run workflow) to check the build and signing without
# publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Each architecture builds on its own runner, at the same time.
  macos-build:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      # A tag can only restore caches saved on main (warm-release-cache.yml saves them), and
      # saves none of its own.
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: 'release-${{ matrix.target }}', save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: cargo build --release -p glass-host --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: glass-host-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/glass-host
          if-no-files-found: error

  # One universal binary, the audio driver and the signature.
  macos:
    needs: macos-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: glass-host-aarch64-apple-darwin, path: target/aarch64-apple-darwin/release }
      - uses: actions/download-artifact@v4
        with: { name: glass-host-x86_64-apple-darwin, path: target/x86_64-apple-darwin/release }
      - name: Install rcodesign (prebuilt, pinned and checked)
        run: |
          v=0.29.0
          curl -fsSL -o "$RUNNER_TEMP/rcodesign.tgz" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$v/apple-codesign-$v-macos-universal.tar.gz"
          echo "d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d  $RUNNER_TEMP/rcodesign.tgz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/rcodesign.tgz" -C "$RUNNER_TEMP/bin" --strip-components=1 "apple-codesign-$v-macos-universal/rcodesign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Package and sign
        env:
          GLASS_PREBUILT: '1'
          SIGNING_KEY: ${{ secrets.GLASS_SIGNING_KEY }}
          SIGNING_CERT: ${{ secrets.GLASS_SIGNING_CERT }}
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
          printf '%s\n' "$SIGNING_CERT" > "$RUNNER_TEMP/signing.crt"
          GLASS_SIGNING_KEY="$RUNNER_TEMP/signing.key" GLASS_SIGNING_CERT="$RUNNER_TEMP/signing.crt" \
            scripts/package.sh macos
          rm -f "$RUNNER_TEMP/signing.key"
      - uses: actions/upload-artifact@v4
        with: { name: dist-macos, path: dist/ }

  linux:
    # PipeWire bindings need PipeWire ≥ 1.0 headers, so build on 24.04 (binary needs glibc ≥ 2.39:
    # Arch/Omarchy, Fedora 40+, Ubuntu 24.04+).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libclang-dev pkg-config nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: release-linux, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: scripts/package.sh linux
      - uses: actions/upload-artifact@v4
        with: { name: dist-linux, path: dist/ }

  windows:
    strategy:
      matrix:
        include:
          - { arch: x86_64, target: x86_64-pc-windows-msvc, runner: windows-latest }
          - { arch: arm64, target: aarch64-pc-windows-msvc, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # NASM gives OpenH264 its x64 assembly (much faster encoding).
      - if: matrix.arch == 'x86_64'
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: 'release-${{ matrix.target }}', save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: pwsh scripts/package.ps1 ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with: { name: 'dist-windows-${{ matrix.arch }}', path: dist/ }

  publish:
    needs: [macos, linux, windows]
    # A hand-run build stops before here: nothing is published.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      # Optional: without these the site is deployed by hand (cd site && npm run deploy).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: 'dist-*', merge-multiple: true }
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: GitHub release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # The notes: this version's entry in CHANGELOG.md, then GitHub's list of pull requests.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $version' entry"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/glass-[0-9]* --notes-file notes.md --generate-notes --title "Glass $GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with: { node-version: 24 }
      - name: Deploy glassdesk.dev (installer serves the new release)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: site
        run: npm ci && npm run deploy
