name: Release

# Push a tag like v0.2.0 (matching Cargo.toml) to build, sign and publish a release.
# Run it by hand (Actions › Release › Run workflow) to check the build and signing without
# publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Each architecture builds on its own runner, at the same time.
  macos-build:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      # A tag can only restore caches saved on main (warm-release-cache.yml saves them), and
      # saves none of its own.
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: 'release-${{ matrix.target }}', save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: cargo build --release -p glass-host --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: glass-host-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/glass-host
          if-no-files-found: error

  # One universal binary, the audio driver and the signature.
  macos:
    needs: macos-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: glass-host-aarch64-apple-darwin, path: target/aarch64-apple-darwin/release }
      - uses: actions/download-artifact@v4
        with: { name: glass-host-x86_64-apple-darwin, path: target/x86_64-apple-darwin/release }
      - name: Install rcodesign (prebuilt, pinned and checked)
        run: |
          v=0.29.0
          curl -fsSL -o "$RUNNER_TEMP/rcodesign.tgz" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$v/apple-codesign-$v-macos-universal.tar.gz"
          echo "d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d  $RUNNER_TEMP/rcodesign.tgz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/rcodesign.tgz" -C "$RUNNER_TEMP/bin" --strip-components=1 "apple-codesign-$v-macos-universal/rcodesign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Package and sign
        env:
          GLASS_PREBUILT: '1'
          SIGNING_KEY: ${{ secrets.GLASS_SIGNING_KEY }}
          SIGNING_CERT: ${{ secrets.GLASS_SIGNING_CERT }}
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing.key"
          printf '%s\n' "$SIGNING_CERT" > "$RUNNER_TEMP/signing.crt"
          GLASS_SIGNING_KEY="$RUNNER_TEMP/signing.key" GLASS_SIGNING_CERT="$RUNNER_TEMP/signing.crt" \
            scripts/package.sh macos
          rm -f "$RUNNER_TEMP/signing.key"
      - uses: actions/upload-artifact@v4
        with: { name: dist-macos, path: dist/ }

  linux:
    # PipeWire bindings need PipeWire ≥ 1.0 headers, so build on 24.04 (binary needs glibc ≥ 2.39:
    # Arch/Omarchy, Fedora 40+, Ubuntu 24.04+).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libclang-dev pkg-config nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: release-linux, save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - run: scripts/package.sh linux
      - uses: actions/upload-artifact@v4
        with: { name: dist-linux, path: dist/ }

  # A zip and an MSI per architecture, signed. Authenticode signing (SHA-256, timestamped)
  # covers glass.exe, glassw.exe and the MSI, with either
  #   Azure Trusted Signing (now Artifact Signing): secrets AZURE_TENANT_ID, AZURE_CLIENT_ID
  #     and AZURE_CLIENT_SECRET (an app registration with the "Trusted Signing Certificate
  #     Profile Signer" role on the account), AZURE_SIGNING_ENDPOINT (the account's region,
  #     e.g. https://eus.codesigning.azure.net/), AZURE_SIGNING_ACCOUNT (the account's name)
  #     and AZURE_SIGNING_PROFILE (its certificate profile); or
  #   a code-signing certificate: secrets WINDOWS_PFX (the .pfx file, base64) and
  #     WINDOWS_PFX_PASSWORD; or
  #   SignPath (free for open source through SignPath Foundation): secret SIGNPATH_API_TOKEN
  #     and variable SIGNPATH_ORGANIZATION_ID; optional variables SIGNPATH_PROJECT (default
  #     glass) and SIGNPATH_POLICY (default release-signing). The project's artifact
  #     configuration is packaging/windows/signpath.xml. Each architecture is one signing
  #     request, approved by hand in SignPath.
  # The first one set wins, in that order. With none, the build is unsigned: a warning, and
  # a release says so in its notes (SmartScreen and Smart App Control warn about it).
  windows:
    strategy:
      matrix:
        include:
          - { arch: x86_64, target: x86_64-pc-windows-msvc, runner: windows-latest }
          - { arch: arm64, target: aarch64-pc-windows-msvc, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: How to sign
        id: sign
        shell: pwsh
        env:
          AZURE: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_SIGNING_ACCOUNT != '' }}
          PFX: ${{ secrets.WINDOWS_PFX != '' }}
          SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          $how = if ($env:AZURE -eq 'true') { 'azure' } elseif ($env:PFX -eq 'true') { 'pfx' } elseif ($env:SIGNPATH -eq 'true') { 'signpath' } else { 'none' }
          if ($how -eq 'none') {
            Write-Host '::warning::unsigned Windows build: SmartScreen and Smart App Control will warn about it (see release.yml to sign)'
          }
          "how=$how" >> $env:GITHUB_OUTPUT
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
      # NASM gives OpenH264 its x64 assembly (much faster encoding).
      - if: matrix.arch == 'x86_64'
        run: |
          choco install nasm --no-progress -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: 'release-${{ matrix.target }}', save-if: "${{ github.ref == 'refs/heads/main' }}" }
      # WiX builds the MSI. Pinned to 5: later majors need their maintenance-fee EULA accepted.
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - run: pwsh scripts/package.ps1 ${{ matrix.arch }} -Step stage

      # The programs, before they go into the zip and the MSI.
      - name: Sign the programs (Azure)
        if: steps.sign.outputs.how == 'azure'
        uses: azure/artifact-signing-action@v2.0.0 # formerly azure/trusted-signing-action
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\package\${{ matrix.arch }}\glass\bin\glass.exe
            ${{ github.workspace }}\target\package\${{ matrix.arch }}\glass\bin\glassw.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Glass
          description-url: https://glassdesk.dev
      - name: Sign the programs (certificate)
        if: steps.sign.outputs.how == 'pfx'
        shell: pwsh
        env: { PFX: '${{ secrets.WINDOWS_PFX }}', GLASS_SIGN_PFX_PASSWORD: '${{ secrets.WINDOWS_PFX_PASSWORD }}' }
        run: |
          $env:GLASS_SIGN_PFX = Join-Path $env:RUNNER_TEMP 'glass.pfx'
          [IO.File]::WriteAllBytes($env:GLASS_SIGN_PFX, [Convert]::FromBase64String($env:PFX))
          try { ./scripts/sign.ps1 target/package/${{ matrix.arch }}/glass/bin/glass.exe target/package/${{ matrix.arch }}/glass/bin/glassw.exe }
          finally { Remove-Item $env:GLASS_SIGN_PFX }

      - run: pwsh scripts/package.ps1 ${{ matrix.arch }} -Step bundle

      - name: Sign the MSI (Azure)
        if: steps.sign.outputs.how == 'azure'
        uses: azure/artifact-signing-action@v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Glass
          description-url: https://glassdesk.dev
      - name: Sign the MSI (certificate)
        if: steps.sign.outputs.how == 'pfx'
        shell: pwsh
        env: { PFX: '${{ secrets.WINDOWS_PFX }}', GLASS_SIGN_PFX_PASSWORD: '${{ secrets.WINDOWS_PFX_PASSWORD }}' }
        run: |
          $env:GLASS_SIGN_PFX = Join-Path $env:RUNNER_TEMP 'glass.pfx'
          [IO.File]::WriteAllBytes($env:GLASS_SIGN_PFX, [Convert]::FromBase64String($env:PFX))
          try { ./scripts/sign.ps1 (Get-ChildItem dist/*.msi).FullName }
          finally { Remove-Item $env:GLASS_SIGN_PFX }

      # SignPath signs the finished zip and MSI in one go (the programs inside both, then the
      # MSI), from an artifact of the unsigned ones, and hands them back in their place.
      - name: Upload for signing (SignPath)
        if: steps.sign.outputs.how == 'signpath'
        id: unsigned
        uses: actions/upload-artifact@v4
        with: { name: 'unsigned-windows-${{ matrix.arch }}', path: 'dist/glass-*', retention-days: 1 }
      - name: Sign (SignPath)
        if: steps.sign.outputs.how == 'signpath'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT || 'glass' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.sign.outputs.version) }}
          # Waits for someone to approve the request in SignPath.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
      - name: Use the signed files
        if: steps.sign.outputs.how == 'signpath'
        run: Copy-Item signed/glass-* dist/ -Force

      # A signed build must be signed all the way through, whichever way it was: the programs
      # as they are in the zip, and the MSI.
      - name: Check the signatures
        if: steps.sign.outputs.how != 'none'
        shell: pwsh
        run: |
          $unzipped = Join-Path $env:RUNNER_TEMP 'check'
          Expand-Archive (Get-ChildItem dist/glass-*.zip).FullName $unzipped -Force
          foreach ($f in @(Get-ChildItem $unzipped/glass/bin/*.exe) + @(Get-ChildItem dist/*.msi)) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if (-not $sig.SignerCertificate -or -not $sig.TimeStamperCertificate) { throw "$($f.Name) isn't signed and timestamped" }
            Write-Host "$($f.Name): $($sig.Status), $($sig.SignerCertificate.Subject)"
          }
      # Tells the release notes (publish) the Windows downloads are unsigned.
      - if: steps.sign.outputs.how == 'none'
        run: New-Item dist/windows-unsigned -ItemType File -Force

      - run: pwsh scripts/package.ps1 ${{ matrix.arch }} -Step sums
      - uses: actions/upload-artifact@v4
        with: { name: 'dist-windows-${{ matrix.arch }}', path: dist/ }

  publish:
    needs: [macos, linux, windows]
    # A hand-run build stops before here: nothing is published.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      # Optional: without these the site is deployed by hand (cd site && npm run deploy).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: 'dist-*', merge-multiple: true }
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: GitHub release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          # The notes: this version's entry in CHANGELOG.md, then GitHub's list of pull requests.
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $version' entry"; exit 1; }
          if [ -e dist/windows-unsigned ]; then
            printf '\n> **Windows:** these builds are not code-signed yet, so SmartScreen may warn before the MSI runs (More info › Run anyway).\n' >> notes.md
          fi
          # The code signing policy, from the docs, so the download page carries it too.
          { echo; awk '/^## Code signing policy$/ { on = 1 } on && /^## / && !/Code signing/ { exit } on' site/docs.md | sed 's/^## /### /'; } >> notes.md
          # A version with a suffix (0.11.0-windows.1) is a pre-release: never "Latest".
          case "$version" in *-*) pre=(--prerelease --latest=false) ;; *) pre=() ;; esac
          # Every platform's archive, the Windows MSIs, and their .sha256 files.
          gh release create "$GITHUB_REF_NAME" dist/glass-[0-9]* "${pre[@]}" --notes-file notes.md --generate-notes --title "Glass $GITHUB_REF_NAME"
      # The winget manifests for this release, to submit to microsoft/winget-pkgs by hand
      # (packaging/winget/README.md).
      - name: winget manifests
        run: node scripts/winget.mjs "${GITHUB_REF_NAME#v}" dist dist/winget
      - uses: actions/upload-artifact@v4
        with: { name: winget-manifests, path: dist/winget/ }
      # Not for a pre-release: the installers and updates keep serving the last release.
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && !contains(github.ref_name, '-')
        with: { node-version: 24 }
      - name: Deploy glassdesk.dev (installer serves the new release)
        if: env.CLOUDFLARE_API_TOKEN != '' && !contains(github.ref_name, '-')
        working-directory: site
        run: npm ci && npm run deploy
