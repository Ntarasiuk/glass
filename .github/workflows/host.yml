name: Host

# One OS: build once in the `ci` profile (Cargo.toml), run the unit tests, then the e2e
# tests split across three machines. Called by ci.yml for macOS and Linux.
on:
  workflow_call:
    inputs:
      os: { type: string, required: true }

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build + unit
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libclang-dev pkg-config nasm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per OS, shared by every branch; only main writes it, so PRs start
          # warm and the cache never fills up with branch copies.
          shared-key: ci-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --profile ci
      - run: cargo build --profile ci -p glass-host
      # Glass Microphone (native/glass-mic): builds, and loads as an audio plug-in.
      - if: runner.os == 'macOS'
        run: |
          cmake -S native/glass-mic -B target/glass-mic -DCMAKE_BUILD_TYPE=Release
          cmake --build target/glass-mic
          clang++ -std=c++17 native/glass-mic/check.cpp -framework CoreFoundation -framework CoreAudio -o target/glass-mic/check
          target/glass-mic/check target/glass-mic/GlassMicrophone.driver/Contents/MacOS/GlassMicrophone
      # The now-playing helper: builds, loads into /usr/bin/perl, and reports a JSON line.
      - if: runner.os == 'macOS'
        run: |
          mkdir -p target/now-playing
          clang -dynamiclib -fobjc-arc -framework Foundation native/now-playing/now_playing.m -o target/now-playing/libglassnowplaying.dylib
          (sleep 3; echo) | /usr/bin/perl -e 'use DynaLoader; my $l = DynaLoader::dl_load_file($ARGV[0]) or die DynaLoader::dl_error(); my $s = DynaLoader::dl_find_symbol($l, "glass_now_playing") or die "no symbol"; DynaLoader::dl_install_xsub("main::run", $s); run();' target/now-playing/libglassnowplaying.dylib | head -1 | grep -q artworkId
      - if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with: { node-version: 24 }
      - if: runner.os == 'Linux'
        run: node --test tests/unit/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: glass-${{ runner.os }}
          path: target/ci/glass-host
          retention-days: 1

  e2e:
    needs: build
    name: e2e ${{ matrix.shard }}/3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ${{ inputs.os }}
    env:
      GLASS_BIN: ${{ github.workspace }}/bin/glass-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: 'glass-${{ runner.os }}', path: bin }
      - run: chmod +x bin/glass-host
      # The binary links PipeWire (screen capture), which the runner doesn't have.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpipewire-0.3-0t64
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            tests/e2e/package-lock.json
      - name: Site deps (the e2e tests run its introducer locally)
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: End-to-end (Chrome, glass --test)
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          # The runners ship Google Chrome; install it only if this one doesn't.
          if [ "$RUNNER_OS" = Linux ]; then command -v google-chrome || npx playwright install --with-deps chrome; else npx playwright install chrome || true; fi
          npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ runner.os }}-${{ matrix.shard }}
          path: tests/e2e/test-results
