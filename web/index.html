<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Glass</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --surface: rgb(22 23 26 / 0.78);
      --surface-solid: #16171a;
      --surface-hover: rgb(255 255 255 / 0.08);
      --surface-active: rgb(255 255 255 / 0.13);
      --border: rgb(255 255 255 / 0.09);
      --text: #f2f3f5;
      --text-dim: #a8acb5;
      --accent: #5cb2ff;
      --accent-ink: #04121f;
      --good: #6fdc8c;
      --warn: #f2c14e;
      --bad: #ff7a7a;
      --radius: 14px;
      --radius-sm: 9px;
      --shadow: 0 10px 30px rgb(0 0 0 / 0.45), 0 2px 6px rgb(0 0 0 / 0.35);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --top: max(10px, env(safe-area-inset-top));
      --right: max(10px, env(safe-area-inset-right));
    }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
    body { font: 14px/1.4 var(--font); color: var(--text); -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased; }
    ::selection { background: rgb(92 178 255 / 0.35); color: var(--text); }
    input, textarea { caret-color: var(--accent); }
    .hidden { display: none !important; }
    .glass {
      background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
      -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4);
    }

    /* One canvas per streamed display: side by side in landscape, stacked in portrait. */
    #screens {
      position: fixed; inset: 0; display: flex; flex-direction: row; gap: 2px;
      touch-action: none; transform-origin: 0 0; will-change: transform;
    }
    /* Side-by-side Mac displays stack on a portrait iPad (order kept); stacked ones always stack. */
    @media (orientation: portrait) { #screens { flex-direction: column; } }
    #screens[data-arrange="column"] { flex-direction: column; }
    #screens > video::-webkit-media-controls { display: none !important; }
    #screens > canvas, #screens > video {
      flex: 1 1 0; min-width: 0; min-height: 0; width: 100%; height: 100%;
      object-fit: contain; touch-action: none; outline: none;
      /* The remote cursor is drawn into the video; a second local one would trail it. */
      cursor: none;
    }
    /* Holds keyboard focus; on iPad, focusing it brings up the on-screen keyboard. */
    #keys {
      position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0;
      font-size: 16px; border: 0; padding: 0; resize: none; pointer-events: none;
    }

    /* Connection state, over the dimmed last frame. */
    #status {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
      background: rgb(0 0 0 / 0.45);
      -webkit-backdrop-filter: blur(14px) saturate(0.8); backdrop-filter: blur(14px) saturate(0.8);
      transition: opacity 320ms var(--ease-out), visibility 320ms;
    }
    #status.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    #status .card { display: grid; justify-items: center; gap: 6px; padding: 26px 30px 24px; border-radius: 18px; text-align: center; min-width: 240px; }
    #status-title { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
    #status-detail { color: var(--text-dim); font-size: 13px; max-width: 34ch; }
    /* A sheen travelling across a thin glass rail: the one moving thing while waiting. */
    #status .rail {
      position: relative; width: 132px; height: 3px; margin-top: 12px; border-radius: 3px; overflow: hidden;
      background: rgb(255 255 255 / 0.08);
    }
    #status .rail::after {
      content: ""; position: absolute; inset: 0; width: 45%;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: sheen 1.4s var(--ease-out) infinite;
    }
    #status[data-state="error"] .rail::after { background: linear-gradient(90deg, transparent, var(--bad), transparent); }
    @keyframes sheen { from { transform: translateX(-100%); } to { transform: translateX(230%); } }

    /* Drawing on the screen: above the screens, below the toolbar. It only takes the
       pointer in draw mode. */
    #annotate { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; touch-action: none; }
    #annotate.drawing { pointer-events: auto; cursor: crosshair; }
    #draw-palette {
      position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 999px;
    }
    #draw-palette .swatch {
      width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid transparent;
      background: var(--swatch); cursor: pointer; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.3);
    }
    #draw-palette .swatch[aria-pressed="true"] { border-color: var(--text); }
    #draw-palette button:not(.swatch) {
      padding: 6px 12px; border: 0; border-radius: 999px; background: var(--surface-hover);
      color: var(--text); font: inherit; font-size: 13px; cursor: pointer;
    }
    #btn-record[aria-pressed="true"] { color: var(--bad); }

    #hud {
      position: fixed; top: var(--top); left: max(10px, env(safe-area-inset-left));
      display: grid; gap: 1px; padding: 8px 11px; border-radius: var(--radius-sm);
      font: 11.5px/1.45 var(--mono); font-variant-numeric: tabular-nums; color: var(--text-dim);
      pointer-events: none; contain: layout paint;
    }
    #hud b { color: var(--text); font-weight: 600; }
    #hud .good { color: var(--good); }
    #hud .warn { color: var(--warn); }
    #hud .bad { color: var(--bad); }

    #toolbar {
      position: fixed; top: var(--top); right: var(--right);
      display: flex; gap: 2px; padding: 4px; border-radius: var(--radius);
      /* Many tools on a phone: wrap onto a second row rather than run off screen. */
      flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - var(--right) - 10px); box-sizing: border-box;
      transition: transform 420ms var(--ease-out), opacity 420ms var(--ease-out);
    }
    /* Idle: tuck up under the top edge, leaving a lip to reach for. */
    #toolbar.idle { transform: translateY(calc(-100% - var(--top) + 7px)); opacity: 0.6; }
    #toolbar.idle button, #toolbar.waking button { pointer-events: none; }
    /* Touch: a fingertip-sized grab handle hangs under the tucked toolbar. Narrow, so it
       covers as little of the remote menu bar as possible. */
    [data-input="touch"] #toolbar.idle::after {
      content: ''; position: absolute; top: 100%; left: 50%; width: 120px; height: 40px; translate: -50% 0;
    }
    [data-input="touch"] #toolbar.idle::before {
      content: ''; position: absolute; top: calc(100% + 7px); left: 50%; width: 40px; height: 5px; translate: -50% 0;
      border-radius: 999px; background: rgb(255 255 255 / 0.75); box-shadow: 0 1px 4px rgb(0 0 0 / 0.5);
    }
    #toolbar button {
      display: grid; place-items: center; width: 40px; height: 40px; padding: 0;
      border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text); cursor: pointer;
      transition: background-color 140ms ease, color 140ms ease;
    }
    #toolbar button:hover { background: var(--surface-hover); }
    #toolbar button:active, #toolbar button[aria-expanded="true"] { background: var(--surface-active); }
    #toolbar button[aria-pressed="true"] { color: var(--accent); }
    #toolbar button:focus-visible, .panel button:focus-visible, .toast button:focus-visible, #zoom-pill button:focus-visible {
      outline: 2px solid var(--accent); outline-offset: -2px;
    }
    #toolbar svg { width: 20px; height: 20px; }

    .panel {
      position: fixed; top: calc(var(--top) + 56px); right: var(--right);
      min-width: 252px; max-width: min(320px, calc(100vw - 20px)); padding: 6px; border-radius: var(--radius);
      transform-origin: top right; animation: open 220ms var(--ease-out);
    }
    @keyframes open { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }
    .panel button {
      display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%;
      padding: 10px 12px; border: 0; border-radius: var(--radius-sm); background: transparent;
      color: var(--text); font: inherit; text-align: left; cursor: pointer;
    }
    .panel button:hover { background: var(--surface-hover); }
    .panel button[aria-checked="true"] { background: rgb(92 178 255 / 0.12); }
    .panel button[aria-checked="true"] .meta { color: var(--accent); }
    .panel button:disabled { cursor: default; color: var(--text-dim); }
    .panel button:disabled:hover { background: transparent; }
    .panel .meta { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
    .panel .note { margin: 2px 12px 8px; max-width: 34ch; color: var(--text-dim); font-size: 12px; line-height: 1.45; }
    .panel hr { margin: 4px 6px; border: 0; border-top: 1px solid var(--border); }

    #zoom-pill {
      position: fixed; left: 50%; top: var(--top); transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px; padding: 5px 5px 5px 14px; border-radius: 999px;
      font-variant-numeric: tabular-nums; font-weight: 600;
    }
    #zoom-pill button {
      padding: 5px 11px; border: 0; border-radius: 999px; background: var(--surface-hover);
      color: var(--text); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    #zoom-pill button:hover { background: var(--surface-active); }

    #toasts {
      position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(440px, calc(100vw - 32px));
    }
    .toast {
      display: flex; align-items: center; gap: 12px; width: 100%; box-sizing: border-box;
      padding: 10px 8px 10px 14px; border-radius: var(--radius);
      animation: rise 300ms var(--ease-out);
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .toast.leaving { opacity: 0; transform: translateY(6px); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    .toast .icon { flex: none; width: 18px; height: 18px; color: var(--accent); }
    .toast.error .icon { color: var(--bad); }
    .toast .text {
      flex: 1; min-width: 0; overflow: hidden; line-height: 1.35;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere;
    }
    .toast progress {
      width: 84px; height: 4px; border: 0; border-radius: 4px; overflow: hidden; appearance: none;
      background: rgb(255 255 255 / 0.1);
    }
    .toast progress::-webkit-progress-bar { background: rgb(255 255 255 / 0.1); }
    .toast progress::-webkit-progress-value { background: var(--accent); border-radius: 4px; }
    .toast progress::-moz-progress-bar { background: var(--accent); }
    .toast .action {
      padding: 6px 13px; border: 0; border-radius: var(--radius-sm); background: var(--accent);
      color: var(--accent-ink); font: inherit; font-weight: 650; cursor: pointer;
    }
    .toast .action:hover { filter: brightness(1.08); }
    .toast .close {
      flex: none; display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0;
      border-radius: 50%; background: transparent; color: var(--text-dim); cursor: pointer;
    }
    .toast .close:hover { background: var(--surface-hover); color: var(--text); }
    .toast .close svg { width: 14px; height: 14px; }

    #auth {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
      background: rgb(0 0 0 / 0.55);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    }
    #auth form {
      display: grid; gap: 12px; width: min(380px, 100%); box-sizing: border-box; padding: 24px; border-radius: 18px;
      animation: rise 320ms var(--ease-out);
    }
    #auth .mark { width: 34px; height: 34px; color: var(--accent); }
    #auth h1 { margin: 2px 0 0; font-size: 19px; letter-spacing: -0.015em; }
    #auth p { margin: 0; color: var(--text-dim); line-height: 1.5; }
    #auth code { font: 12.5px var(--mono); color: var(--text); }
    #auth input {
      padding: 11px 13px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: rgb(0 0 0 / 0.35); color: var(--text); font: 15px var(--mono); -webkit-user-select: text; user-select: text;
      transition: border-color 140ms ease;
    }
    #auth input:focus { outline: none; border-color: var(--accent); }
    #auth input[aria-invalid="true"] { border-color: var(--bad); }
    #auth .error { color: var(--bad); font-size: 13px; }
    #auth button {
      padding: 11px; border: 0; border-radius: var(--radius-sm); background: var(--accent); color: var(--accent-ink);
      font: inherit; font-weight: 650; cursor: pointer;
    }
    #auth button:hover { filter: brightness(1.08); }
    #auth button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

    /* Phones: the full toolbar is wider than the screen; tighten it, scroll as a last resort. */
    @media (max-width: 440px) {
      #toolbar { gap: 0; padding: 3px; max-width: calc(100vw - 2 * var(--right)); overflow-x: auto; scrollbar-width: none; }
      #toolbar::-webkit-scrollbar { display: none; }
      #toolbar button { width: 34px; height: 36px; flex: none; }
      #toolbar svg { width: 18px; height: 18px; }
    }
    /* The host's shell, over the lower part of the screen. */
    #terminal {
      position: fixed; left: max(10px, env(safe-area-inset-left)); right: var(--right); bottom: max(10px, env(safe-area-inset-bottom));
      height: min(420px, 55vh); display: grid; grid-template-rows: auto 1fr; border-radius: var(--radius); overflow: hidden;
      animation: rise 300ms var(--ease-out);
    }
    #terminal header {
      display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 14px;
      color: var(--text-dim); font-size: 12.5px; border-bottom: 1px solid var(--border);
    }
    #terminal header span { flex: 1; }
    #terminal header button {
      padding: 5px 10px; border: 0; border-radius: var(--radius-sm); background: transparent;
      color: var(--text); font: inherit; cursor: pointer;
    }
    #terminal header button:hover { background: var(--surface-hover); }
    #terminal-screen { min-height: 0; padding: 6px 4px 4px 10px; background: #0b0c0e; -webkit-user-select: text; user-select: text; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
    }
    /* Chat */
    #btn-chat { position: relative; }
    #btn-chat .dot { position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    #chat-panel { display: grid; gap: 8px; width: min(320px, calc(100vw - 20px)); box-sizing: border-box; }
    #chat-panel .chat-log { list-style: none; margin: 0; padding: 4px 6px; max-height: 40vh; overflow-y: auto; display: grid; gap: 6px; -webkit-user-select: text; user-select: text; }
    #chat-panel .chat-log li { display: grid; gap: 1px; }
    #chat-panel .chat-log b { font-size: 12px; font-weight: 600; color: var(--text-dim); }
    #chat-panel .chat-log li.mine b { color: var(--accent); }
    #chat-panel .chat-log span { overflow-wrap: anywhere; }
    #chat-panel .chat-form { display: flex; gap: 6px; }
    #chat-panel .chat-form input { flex: 1; min-width: 0; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: rgb(0 0 0 / 0.35); color: var(--text); font: inherit; -webkit-user-select: text; user-select: text; }
    #chat-panel .chat-form button { width: auto; padding: 8px 12px; background: var(--accent); color: var(--accent-ink); font-weight: 650; justify-content: center; }
    #chat-panel .chat-form button:hover { background: var(--accent); filter: brightness(1.08); }
    #auth .sso { display: block; padding: 11px; border-radius: var(--radius-sm); border: 1px solid var(--border); color: var(--text); text-align: center; text-decoration: none; font-weight: 600; }
    #auth .sso:hover { background: var(--surface-hover); }
  </style>
</head>
<body>
  <div id="screens"></div>
  <textarea id="keys" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Keyboard input"></textarea>
  <div id="hud" class="glass hidden" aria-hidden="true"></div>
  <div id="status" data-state="connecting" role="status" aria-live="polite">
    <div class="card glass">
      <div id="status-title">Connecting</div>
      <div id="status-detail"></div>
      <div class="rail" aria-hidden="true"></div>
    </div>
  </div>

  <nav id="toolbar" class="glass" aria-label="Glass controls">
    <button id="btn-machines" title="Machines" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="13" height="9" rx="1.5"/><rect x="9" y="12" width="13" height="9" rx="1.5"/></svg>
    </button>
    <button id="btn-displays" title="Displays" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </button>
    <button id="btn-keyboard" title="Keyboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
    </button>
    <button id="btn-shortcuts" title="Mac shortcuts" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6z"/></svg>
    </button>
    <button id="btn-upload" title="Send files to Mac">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    </button>
    <button id="btn-download" title="Get files from Mac">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    </button>
    <button id="btn-audio" title="Audio" class="hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path id="audio-waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button id="btn-more" title="Computer" class="hidden" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
    </button>
    <button id="btn-mic" title="Microphone" class="hidden" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button id="btn-terminal" title="Terminal" aria-pressed="false" class="hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>
    </button>
    <button id="btn-ports" title="Forwarded ports" aria-haspopup="true" aria-expanded="false" class="hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>
    </button>
    <button id="btn-draw" title="Draw on the screen" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
    </button>
    <button id="btn-record" title="Record on the host" aria-pressed="false" class="hidden">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle id="record-dot" cx="12" cy="12" r="4" fill="currentColor"/></svg>
    </button>
    <button id="btn-fullscreen" title="Fullscreen (Ctrl+Shift+F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button id="btn-stats" title="Stats (Ctrl+Shift+H)" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    </button>
  </nav>

  <div id="machines-panel" class="panel glass hidden" role="menu" aria-label="Machines"></div>
  <div id="displays-panel" class="panel glass hidden" role="menu" aria-label="Displays"></div>
  <div id="shortcuts-panel" class="panel glass hidden" role="menu" aria-label="Mac shortcuts"></div>
  <div id="more-panel" class="panel glass hidden" role="menu" aria-label="Computer"></div>
  <div id="ports-panel" class="panel glass hidden" role="menu" aria-label="Forwarded ports"></div>
  <section id="terminal" class="glass hidden" aria-label="Terminal">
    <header><span>Terminal</span><button id="terminal-end" type="button">End shell</button><button id="terminal-close" type="button">Hide</button></header>
    <div id="terminal-screen"></div>
  </section>
  <div id="zoom-pill" class="glass hidden"><span id="zoom-level">1×</span><button id="zoom-reset" type="button">Reset</button></div>
  <div id="toasts" aria-live="polite"></div>
  <input id="file-input" type="file" multiple class="hidden">

  <div id="auth" class="hidden">
    <form class="glass" novalidate>
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <h1>Sign in to this computer</h1>
      <p>This device isn't on the same Tailscale account, so it needs the access token. On the host, run <code>glass token</code>.</p>
      <p id="auth-error" class="error hidden" role="alert">That token didn't work. Check it and try again.</p>
      <input name="token" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Access token" aria-label="Access token" required>
      <button type="submit">Connect</button>
      <a id="sso" class="sso hidden" href="sso/start">Sign in with your organization</a>
    </form>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
