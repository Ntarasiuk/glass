[package]
name = "glass-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
cliclack = "0.5.6"
console = "0.16.6"
glass-proto = { version = "0.10.0", path = "../glass-proto" }
openh264 = "0.9"
openh264-sys2 = "0.9"
ring = "0.17.14"
qrcode = { version = "0.14.1", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wtransport = { version = "0.7.2", features = ["dangerous-configuration"] }
futures-util = "0.3.34"
webrtc = "0.21.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
async-trait = "0.1.92"
base64 = "0.22.1"
libc = "0.2.191"
hyper = { version = "1.12.0", features = ["client", "http1"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rtc = { version = "0.21.1", default-features = false }
ldap3 = { version = "0.12.1", default-features = false, features = ["tls-rustls-ring"] }
png = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
gpui-kit = "0.8"
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSColor", "NSGraphics", "NSCell", "NSActionCell", "NSButtonCell", "NSAccessibilityProtocols", "NSUserInterfaceItemIdentification", "NSAppearance", "NSRunningApplication", "NSWorkspace", "NSWindow", "NSScreen", "NSBezierPath", "NSBitmapImageRep", "NSImageRep", "objc2-core-foundation"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "AudioHardwareDeprecated", "objc2-core-audio-types"] }
objc2-core-audio-types = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
objc2-video-toolbox = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "file_chooser"] }
evdev = "0.13"
pipewire = "0.10"
# Hardware H.264 through VA-API (Intel, AMD), with OpenH264 as the fallback.
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Linux: GLASS_ENCODER=vaapi encodes on the GPU through GStreamer's VA-API plugin (falling
# back to OpenH264). Off by default: it links the GStreamer libraries, so the host would
# need them to start.
vaapi = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
