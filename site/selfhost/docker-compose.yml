# Self-hosted Glass remote access: the introducer (signalling only; video never passes
# through it), HTTPS in front of it, and a TURN relay for viewers behind strict NATs.
# See README.md. Settings come from .env next to this file.
services:
  glass:
    build:
      context: ../..
      dockerfile: site/selfhost/Dockerfile
    restart: unless-stopped
    environment:
      TURN_URLS: "turn:${GLASS_DOMAIN:?set GLASS_DOMAIN in .env}:3478?transport=udp,turn:${GLASS_DOMAIN}:3478?transport=tcp"
      TURN_SECRET: "${TURN_SECRET:?set TURN_SECRET in .env}"
    volumes:
      - glass-data:/data
    expose:
      - "8787"

  # HTTPS with an automatic Let's Encrypt certificate (browsers need it for WebRTC).
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${GLASS_DOMAIN} --to glass:8787
    volumes:
      - caddy-data:/data
    depends_on:
      - glass

  # TURN: relays media only when a direct connection fails. Host networking because it
  # allocates a UDP port per relayed session.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${GLASS_DOMAIN}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      # Never relay into private networks (it would let anyone reach your LAN).
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255

volumes:
  glass-data:
  caddy-data:
