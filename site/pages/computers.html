<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your computers · Glass</title>
  <meta name="description" content="Which of your computers are online, and a way to open each one from anywhere.">
  <link rel="canonical" href="https://glassdesk.dev/computers">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <meta name="theme-color" content="#07080a">
  <link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/glassy/glassy.css">
  <link rel="stylesheet" href="/style.css">
  <!-- No third-party scripts on a page about your computers. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <!-- Personal to each browser: nothing to index. -->
  <meta name="robots" content="noindex">
  <meta property="article:modified_time" content="{{modified}}">
  <style>
    .computers { display: grid; gap: clamp(28px, 4vw, 44px); padding: clamp(40px, 7vw, 88px) 0 clamp(48px, 8vw, 96px); max-width: 720px; }
    .computers section { padding: 0; }
    .computers h1 { margin: 0; font-size: clamp(38px, 5.4vw, 64px); line-height: 1; }
    .computers h2 { margin: 0 0 6px; font-size: 26px; }
    .computers .lead, .computers .note { margin: 0; color: var(--text-dim); }
    .computers .lead { margin-top: 18px; font-size: clamp(17px, 1.5vw, 19px); max-width: 52ch; }
    .computers .note { font-size: 15px; }
    .list { margin: 14px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
    .list li { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: rgb(255 255 255 / 0.05); }
    .list .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; background: rgb(255 255 255 / 0.22); }
    .list .on .dot { background: #34c759; }
    .list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .list .detail { flex: none; color: var(--text-faint); font-size: 14px; }
    .list .who { flex: 1; min-width: 0; display: grid; gap: 3px; }
    .list .who .name { flex: none; }
    .list .meta { color: var(--text-faint); font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
    .list .meta .warn { color: #ffb86b; }
    .list li { flex-wrap: wrap; }
    .list .acts { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 4px; }
    .list .acts button, .list .manage { padding: 6px 12px; border-radius: 10px; border: 1px solid rgb(255 255 255 / 0.18); background: rgb(255 255 255 / 0.06); color: inherit; font: inherit; font-size: 14px; cursor: pointer; }
    .list .acts button:disabled { opacity: 0.5; cursor: default; }
    .list .acts .act-status { flex-basis: 100%; font-size: 13px; color: var(--text-faint); white-space: pre-wrap; overflow-wrap: anywhere; }
    #policy { margin: 0 0 14px; padding: 12px 16px; border-radius: 14px; background: rgb(255 255 255 / 0.04); }
    #policy summary { cursor: pointer; font-weight: 600; }
    #policy summary .count { color: var(--text-faint); font-weight: 400; }
    #policy form { display: grid; gap: 10px; margin-top: 12px; }
    #policy label { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #policy input[type=number], #policy input[type=text] { width: 90px; padding: 6px 8px; border-radius: 8px; border: 1px solid rgb(255 255 255 / 0.15); background: rgb(0 0 0 / 0.3); color: inherit; font: inherit; }
    #policy .save { display: flex; gap: 12px; align-items: center; }
    #find { width: 100%; box-sizing: border-box; margin: 4px 0 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgb(255 255 255 / 0.12); background: rgb(0 0 0 / 0.3); color: inherit; font: inherit; }
    .list a.open { flex: none; padding: 7px 14px; border-radius: 10px; background: var(--accent); color: #04121f; font-weight: 650; font-size: 14px; text-decoration: none; }
    .list button.forget { flex: none; padding: 0 4px; border: 0; background: none; color: var(--text-faint); font-size: 18px; line-height: 1; cursor: pointer; }
    .list button.forget:hover { color: var(--text-dim); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .actions button { padding: 10px 18px; border: 1px solid rgb(255 255 255 / 0.14); border-radius: 12px; background: rgb(255 255 255 / 0.06); color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
    .actions button.primary { border-color: transparent; background: var(--accent); color: #04121f; }
    .actions button.quiet { border-color: transparent; background: none; color: var(--text-faint); font-weight: 500; }
    .actions button:disabled { opacity: 0.6; cursor: default; }
    .computers .claim { padding: 18px 20px; border-radius: 16px; border: 1px solid rgb(255 255 255 / 0.14); background: rgb(255 255 255 / 0.06); }
    .claim h2 { font-size: 22px; }
    .hidden { display: none !important; }
    .form-status { margin: 10px 0 0; color: var(--text-dim); font-size: 15px; }
    .form-status:empty, .list:empty { display: none; }
    .note code { font-size: 0.92em; }
  </style>
</head>
<body>
  <header class="site wrap lg-glass-surface" data-lg-preset="header">
    <a class="brand" href="/"><img src="/icon.svg" alt="Glass logo" width="26" height="26">Glass</a>
    <nav aria-label="Main">
      <a href="/features">Features</a>
      <a href="/guides">Guides</a>
      <a href="/docs">Docs</a>
      <a href="https://github.com/Ntarasiuk/glass">GitHub</a>
    </nav>
  </header>
  <main class="computers wrap">
    <section>
      <h1>Your computers.</h1>
      <p class="lead">Which are online, and a way into each from anywhere.</p>
    </section>

    <section class="claim hidden" id="claim" aria-labelledby="claim-title">
      <h2 id="claim-title"></h2>
      <p class="note" id="claim-note"></p>
      <div class="actions" id="claim-actions"></div>
      <p class="form-status" id="claim-status" role="status"></p>
    </section>

    <section class="hidden" id="mine" aria-labelledby="mine-title">
      <h2 id="mine-title">On your account</h2>
      <p class="note" id="mine-note"></p>
      <details id="policy" class="hidden">
        <summary>Policy <span class="count" id="policy-count"></span></summary>
        <form id="policy-form">
          <label><input type="checkbox" name="filevault"> Disk encryption on (FileVault)</label>
          <label><input type="checkbox" name="firewall"> Firewall on</label>
          <label><input type="checkbox" name="glass_current"> Glass up to date</label>
          <label>Free disk space at least <input type="number" name="disk_free_gb" min="0" max="100000"> GB</label>
          <label>macOS at least <input type="text" name="os_min" inputmode="decimal" placeholder="15.1" autocomplete="off"></label>
          <label>Details reported within <input type="number" name="fresh_hours" min="0" max="8760"> hours</label>
          <div class="save"><button type="submit">Save policy</button><span class="form-status" id="policy-status" role="status"></span></div>
          <p class="note">A check that can't be made (a Linux computer has no FileVault) isn't failed. 0 or empty turns a rule off.</p>
        </form>
      </details>
      <input id="find" type="search" class="hidden" placeholder="Search your computers" aria-label="Search your computers" autocomplete="off">
      <ul class="list" id="mine-list"></ul>
    </section>

    <section aria-labelledby="account-title">
      <h2 id="account-title">Your account</h2>
      <p class="note" id="account-note"></p>
      <div class="actions" id="account-actions"></div>
      <p class="form-status" id="account-status" role="status"></p>
    </section>

    <section id="browser" aria-labelledby="browser-title">
      <h2 id="browser-title">On this browser</h2>
      <p class="note" id="browser-note"></p>
      <ul class="list" id="browser-list"></ul>
    </section>
  </main>
  {{footer}}
  <script src="/site.js" type="module"></script>
  <script type="module">
    // The computers this browser opened from anywhere (glass.remotes, kept by /app/), and
    // whether each is online: the introducer knows which hosts are connected to it.
    const REMOTES_KEY = 'glass.remotes';
    const REFRESH_MS = 30_000;
    const $ = (id) => document.getElementById(id);
    /** Sets a note's text; `like this` becomes code. */
    function say(id, text) {
      $(id).replaceChildren(...text.split('`').map((part, i) => {
        if (!(i % 2)) return part;
        const code = document.createElement('code');
        code.textContent = part;
        return code;
      }));
    }
    const remotes = () => { try { return JSON.parse(localStorage.getItem(REMOTES_KEY) ?? '[]'); } catch { return []; } };
    const saveRemotes = (list) => { try { localStorage.setItem(REMOTES_KEY, JSON.stringify(list)); } catch {} };

    function row({ name, on, href, onForget, meta = [], acts }) {
      const li = document.createElement('li');
      if (on) li.className = 'on';
      const dot = document.createElement('span');
      dot.className = 'dot';
      const label = document.createElement('span');
      label.className = 'name';
      label.textContent = name;
      const who = document.createElement('span');
      who.className = 'who';
      who.append(label);
      if (meta.length) {
        const line = document.createElement('span');
        line.className = 'meta';
        meta.forEach((m, i) => {
          if (i) line.append(' · ');
          const part = document.createElement('span');
          part.textContent = m.text;
          if (m.warn) part.className = 'warn';
          line.append(part);
        });
        who.append(line);
      }
      const info = document.createElement('span');
      info.className = 'detail';
      info.textContent = on ? 'online' : 'offline';
      li.append(dot, who, info);
      if (acts) {
        const open = document.createElement('button');
        open.type = 'button';
        open.className = 'manage';
        open.textContent = 'Actions';
        open.setAttribute('aria-expanded', 'false');
        let panel;
        const show = (on) => {
          acts.remember(on);
          if (!on) { panel?.remove(); panel = null; open.setAttribute('aria-expanded', 'false'); return; }
          panel = acts.build();
          li.append(panel);
          open.setAttribute('aria-expanded', 'true');
        };
        open.addEventListener('click', () => show(!panel));
        li.append(open);
        // The list is drawn again on every refresh: an open panel stays open.
        if (acts.wasOpen) show(true);
      }
      if (!href) return li;
      const a = document.createElement('a');
      a.className = 'open';
      a.href = href;
      a.textContent = 'Open';
      li.append(a);
      if (onForget) {
        const x = document.createElement('button');
        x.type = 'button';
        x.className = 'forget';
        x.title = `Forget ${name}`;
        x.setAttribute('aria-label', `Forget ${name}`);
        x.textContent = '×';
        x.addEventListener('click', onForget);
        li.append(x);
      }
      return li;
    }

    /** The introducer's id for a host key: the first 16 bytes of its SHA-256 (as in rtc.js). */
    async function hostId(key) {
      const raw = Uint8Array.from(atob(key.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
      const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', raw)).slice(0, 16);
      return btoa(String.fromCharCode(...digest)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function showBrowser() {
      const list = remotes();
      $('browser').classList.toggle('hidden', !list.length && Boolean(account));
      if (!list.length) {
        say('browser-note', 'Computers you open with a link from `glass link --anywhere` show up here.');
        $('browser-list').replaceChildren();
        return;
      }
      $('browser-note').textContent = 'Opened from this browser before.';
      const ids = await Promise.all(list.map((c) => hostId(c.key).catch(() => '')));
      const { online = {} } = await fetch(`/signal/online?ids=${ids.filter(Boolean).join(',')}`).then((r) => r.json()).catch(() => ({}));
      const forget = (key) => () => {
        saveRemotes(remotes().filter((c) => c.key !== key));
        showBrowser();
      };
      $('browser-list').replaceChildren(...list.map((c, i) => row({
        name: c.name,
        on: Boolean(online[ids[i]]),
        href: `/app/#r=${encodeURIComponent(c.key)}`,
        onForget: forget(c.key),
      })));
    }

    // Accounts: a passkey, nothing else. The site checks each ceremony (src/accounts.js);
    // the session is an HttpOnly cookie this page never sees.
    const enc = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    const dec = (text) => Uint8Array.from(atob(text.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
    let account = null;

    async function api(path, { method = 'GET', body } = {}) {
      const r = await fetch(path, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body && JSON.stringify(body) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error(out.error ?? 'Something went wrong. Try again.'), out, { status: r.status });
      return out;
    }

    /** A new account, or (signed in) another passkey for this one, say from another password manager. */
    async function createPasskey() {
      const o = await api('/api/account/challenge', { method: 'POST', body: { mode: 'create' } });
      const cred = await navigator.credentials.create({ publicKey: {
        ...o,
        challenge: dec(o.challenge),
        user: { ...o.user, id: dec(o.user.id) },
        excludeCredentials: o.excludeCredentials.map((c) => ({ ...c, id: dec(c.id) })),
      } });
      const r = cred.response;
      const publicKey = r.getPublicKey();
      if (!publicKey) throw new Error('This browser can\'t share the passkey\'s key. Try another browser.');
      await api('/api/account/passkey', { method: 'POST', body: {
        id: cred.id,
        clientDataJSON: enc(r.clientDataJSON),
        authenticatorData: enc(r.getAuthenticatorData()),
        publicKey: enc(publicKey),
        publicKeyAlgorithm: r.getPublicKeyAlgorithm(),
      } });
    }

    async function signIn() {
      const o = await api('/api/account/challenge', { method: 'POST', body: { mode: 'get' } });
      const cred = await navigator.credentials.get({ publicKey: { ...o, challenge: dec(o.challenge) } });
      const r = cred.response;
      try {
        await api('/api/account/session', { method: 'POST', body: {
          id: cred.id,
          clientDataJSON: enc(r.clientDataJSON),
          authenticatorData: enc(r.authenticatorData),
          signature: enc(r.signature),
          userHandle: r.userHandle ? enc(r.userHandle) : undefined,
        } });
      } catch (e) {
        // Its account is gone: let the password manager drop it.
        if (e.unknown) PublicKeyCredential.signalUnknownCredential?.({ rpId: location.hostname, credentialId: cred.id }).catch(() => {});
        throw e;
      }
    }

    function button(text, onClick, kind = '') {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = text;
      if (kind) b.className = kind;
      b.addEventListener('click', async () => {
        for (const other of $('account-actions').querySelectorAll('button')) other.disabled = true;
        $('account-status').textContent = '';
        try {
          await onClick();
        } catch (e) {
          // Closing the passkey sheet isn't an error worth a message.
          if (e.name !== 'NotAllowedError' && e.name !== 'AbortError') $('account-status').textContent = e.message;
        }
        await showAccount();
        await Promise.all([showClaim(), showMine()]);
      });
      return b;
    }

    async function showAccount() {
      ({ account } = await api('/api/account').catch(() => ({ account: null })));
      if (!window.PublicKeyCredential) {
        $('account-note').textContent = 'This browser can\'t use passkeys.';
        $('account-actions').replaceChildren();
        return;
      }
      if (!account) {
        $('account-note').textContent = 'Sign in with a passkey to see your computers on every device: it syncs through iCloud Keychain, Google Password Manager or your password manager. No email, no password.';
        $('account-actions').replaceChildren(
          button('Sign in', signIn, 'primary'),
          button('Create an account', createPasskey),
        );
        return;
      }
      $('account-note').textContent = `Signed in with a passkey${account.passkeys > 1 ? ` (this account has ${account.passkeys})` : ''}.`;
      $('account-actions').replaceChildren(
        button('Sign out', () => api('/api/account/session', { method: 'DELETE' })),
        button('Add a passkey', createPasskey),
        button('Delete account', async () => {
          if (!confirm('Delete your account? Your computers stay as they are; only this list goes.')) return;
          await api('/api/account', { method: 'DELETE' });
        }, 'quiet'),
      );
    }

    const ago = (ms) => {
      const m = Math.max(0, Math.round((Date.now() - ms) / 60_000));
      return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
    };
    /** What a computer said about itself (glass fleet on), as short facts; a problem is `warn`. */
    function facts(r) {
      if (!r) return [];
      const out = [];
      const add = (text, warn = false) => text && out.push({ text, warn });
      add([r.model, r.chip].filter(Boolean).join(' '));
      add(r.os);
      add(r.ram_gb && `${r.ram_gb} GB memory`);
      if (r.disk_total_gb) add(`${r.disk_free_gb} GB free of ${r.disk_total_gb}`, r.disk_free_gb < Math.max(10, r.disk_total_gb * 0.1));
      if (r.filevault !== undefined) add(r.filevault ? 'FileVault on' : 'FileVault off', !r.filevault);
      if (r.firewall !== undefined) add(r.firewall ? 'firewall on' : 'firewall off', !r.firewall);
      if (r.battery !== undefined) add(`battery ${r.battery}%`, r.battery < 15);
      add(r.uptime_h !== undefined && (r.uptime_h < 48 ? `up ${r.uptime_h} h` : `up ${Math.round(r.uptime_h / 24)} days`));
      add(r.version && `Glass ${r.version}`);
      add(r.at && `reported ${ago(r.at)}`, r.at && Date.now() - r.at > 3 * 3600_000);
      return out;
    }

    const ACTIONS = [
      ['report', 'Refresh details'],
      ['update_glass', 'Update Glass', 'Update Glass on {name}? It restarts when it\'s done.'],
      ['restart_glass', 'Restart Glass', 'Restart Glass on {name}? Anyone viewing reconnects in a few seconds.'],
      ['restart_computer', 'Restart computer', 'Restart {name}? Open apps are asked to quit.'],
    ];

    /** Signs a command with a passkey (you verify it with your fingerprint, face or PIN). */
    async function runAction(c, action, arg = '') {
      const cmd = JSON.stringify({ v: 1, host: c.id, action, arg, nonce: enc(crypto.getRandomValues(new Uint8Array(16))), exp: Math.floor(Date.now() / 1000) + 120 });
      const challenge = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(cmd)));
      const got = await navigator.credentials.get({ publicKey: { challenge, rpId: location.hostname, userVerification: 'required', timeout: 60_000 } });
      const r = got.response;
      return api(`/api/account/computers/${c.id}/action`, {
        method: 'POST',
        body: { cmd, assertion: { id: got.id, clientDataJSON: enc(r.clientDataJSON), authenticatorData: enc(r.authenticatorData), signature: enc(r.signature) } },
      });
    }

    const openActs = new Set(); // computers whose Actions panel is open
    const actStatus = new Map(); // what the last action on each said

    function actionsPanel(c) {
      const box = document.createElement('div');
      box.className = 'acts';
      const status = document.createElement('span');
      status.className = 'act-status';
      status.setAttribute('role', 'status');
      status.textContent = actStatus.get(c.id) ?? '';
      status.dataset.actStatus = c.id;
      // The list is drawn again on refresh, so say it wherever this computer's panel is now.
      const say = (text) => {
        actStatus.set(c.id, text);
        for (const el of document.querySelectorAll('.act-status')) if (el.dataset.actStatus === c.id) el.textContent = text;
      };
      const go = async (action, arg, question) => {
        if (question && !confirm(question.replace('{name}', c.name))) return;
        for (const b of box.querySelectorAll('button')) b.disabled = true;
        say('Waiting for your passkey…');
        try {
          const out = await runAction(c, action, arg);
          say(out.message);
          if (action === 'report') setTimeout(showMine, 500);
        } catch (e) {
          say(e.name === 'NotAllowedError' ? 'Cancelled.' : e.message);
        }
        for (const b of box.querySelectorAll('button')) b.disabled = false;
      };
      for (const [action, label, question] of ACTIONS) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        b.addEventListener('click', () => go(action, '', question));
        box.append(b);
      }
      const script = document.createElement('button');
      script.type = 'button';
      script.textContent = 'Run a script…';
      script.addEventListener('click', () => {
        const name = prompt(`The name of a script in ~/.config/glass/fleet/scripts on ${c.name}:`);
        if (name) go('run_script', name.trim(), `Run ${name.trim()} on {name}?`);
      });
      box.append(script, status);
      return box;
    }

    // A link from `glass fleet manage` (#manage=<computer>.<code>): lets this account run
    // actions on that computer, vouched for with the code, which never leaves this browser.
    function takeManageFromLink() {
      const v = new URLSearchParams(location.hash.slice(1)).get('manage');
      if (!v) return false;
      try { sessionStorage.setItem('glass.manage', v); } catch {}
      history.replaceState(null, '', location.pathname);
      return true;
    }
    const pendingManage = () => { try { return sessionStorage.getItem('glass.manage'); } catch { return null; } };
    const dropManage = () => { try { sessionStorage.removeItem('glass.manage'); } catch {} };

    async function enrollManager(hostId, pin) {
      const { account: me } = await api('/api/account');
      const got = await navigator.credentials.get({ publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rpId: location.hostname,
        userVerification: 'required',
        allowCredentials: me.keys.map((k) => ({ type: 'public-key', id: dec(k.id) })),
        timeout: 60_000,
      } });
      const k = me.keys.find((x) => x.id === got.id);
      if (!k) throw new Error('That passkey isn\'t on this account.');
      if (k.alg !== -7) throw new Error('That kind of passkey can\'t manage computers. Use a passkey from a phone, a Mac or a security key (most are ES256).');
      const hmac = await crypto.subtle.importKey('raw', dec(pin), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
      const mac = enc(await crypto.subtle.sign('HMAC', hmac, new TextEncoder().encode(`glass-manage-v1\n${hostId}\n${k.id}\n${k.key}`)));
      const out = await api(`/api/account/computers/${hostId}/manage`, { method: 'POST', body: { cred: k.id, key: k.key, mac } });
      if (!out.ok) throw new Error(out.message);
    }

    // ---- Policy: the rules, checked here against each computer's report ----
    let policy = null;
    let latest = null; // the newest Glass release
    const parts = (v) => (String(v ?? '').match(/\d+(\.\d+)*/)?.[0] ?? '').split('.').filter(Boolean).map(Number);
    /** Is `have` at least `want`? `null` when either has no version to compare. */
    function atLeast(have, want) {
      const a = parts(have), b = parts(want);
      if (!a.length || !b.length) return null;
      for (let i = 0; i < Math.max(a.length, b.length); i++) {
        const d = (a[i] ?? 0) - (b[i] ?? 0);
        if (d) return d > 0;
      }
      return true;
    }
    /** What a report breaks in the policy; `null` when there's no report to check. */
    function breaks(r) {
      if (!r || !policy) return null;
      const out = [];
      if (policy.filevault && r.filevault === false) out.push('FileVault off');
      if (policy.firewall && r.firewall === false) out.push('firewall off');
      if (policy.disk_free_gb && r.disk_total_gb && r.disk_free_gb < policy.disk_free_gb) out.push(`under ${policy.disk_free_gb} GB free`);
      if (policy.os_min && atLeast(r.os, policy.os_min) === false) out.push(`system older than ${policy.os_min}`);
      if (policy.glass_current && latest && atLeast(r.version, latest) === false) out.push('Glass out of date');
      if (policy.fresh_hours && r.at && Date.now() - r.at > policy.fresh_hours * 3600_000) out.push(`no report for ${policy.fresh_hours}+ hours`);
      return out;
    }
    const hasRules = () => policy && (policy.filevault || policy.firewall || policy.glass_current || policy.disk_free_gb || policy.os_min || policy.fresh_hours);

    function fillPolicy() {
      const f = $('policy-form');
      for (const el of f.elements) {
        if (!el.name) continue;
        if (el.type === 'checkbox') el.checked = Boolean(policy[el.name]);
        else el.value = policy[el.name] || '';
      }
    }
    $('policy-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target.elements;
      const body = {
        filevault: f.filevault.checked, firewall: f.firewall.checked, glass_current: f.glass_current.checked,
        disk_free_gb: Number(f.disk_free_gb.value) || 0, fresh_hours: Number(f.fresh_hours.value) || 0, os_min: f.os_min.value.trim(),
      };
      try {
        ({ policy } = await api('/api/account/policy', { method: 'PUT', body }));
        fillPolicy();
        $('policy-status').textContent = 'Saved.';
        drawMine();
      } catch (err) {
        $('policy-status').textContent = err.message;
      }
    });

    /** The facts about a computer, then what it breaks of the policy. */
    function metaFor(c) {
      const out = facts(c.report);
      const bad = breaks(c.report);
      if (bad?.length) out.push({ text: `Not compliant: ${bad.join(', ')}`, warn: true });
      return out;
    }

    let mineList = [];
    function drawMine() {
      const q = $('find').value.trim().toLowerCase();
      const shown = mineList.filter((c) => !q || [c.name, c.online ? 'online' : 'offline', ...metaFor(c).map((f) => f.text)].join(' ').toLowerCase().includes(q));
      $('mine-list').replaceChildren(...shown.map((c) => row({
        name: c.name,
        on: c.online,
        meta: metaFor(c),
        acts: c.report?.managed ? { build: () => actionsPanel(c), wasOpen: openActs.has(c.id), remember: (on) => (on ? openActs.add(c.id) : openActs.delete(c.id)) } : null,
        href: `/app/#r=${encodeURIComponent(c.key)}`,
        onForget: async () => {
          if (!confirm(`Take ${c.name} off your account? To add it back, run glass account add on it.`)) return;
          await api(`/api/account/computers/${c.id}`, { method: 'DELETE' }).catch(() => {});
          showMine();
        },
      })));
      drawPolicy();
    }
    $('find').addEventListener('input', drawMine);
    function drawPolicy() {
      $('policy').classList.toggle('hidden', !account || !mineList.length || !policy);
      if (!policy) return;
      const checked = mineList.map((c) => breaks(c.report)).filter(Boolean);
      const meet = checked.filter((b) => !b.length).length;
      $('policy-count').textContent = !hasRules() ? '· none set' : `· ${meet} of ${checked.length} meet it${mineList.length > checked.length ? ` · ${mineList.length - checked.length} without details` : ''}`;
    }

    async function showMine() {
      $('mine').classList.toggle('hidden', !account);
      $('browser').classList.toggle('hidden', !remotes().length && Boolean(account));
      if (!account) return;
      const { computers = [] } = await api('/api/account/computers').catch(() => ({}));
      mineList = computers;
      const [p, v] = await Promise.all([api('/api/account/policy').catch(() => null), fetch('/version.json').then((r) => r.json()).catch(() => ({}))]);
      if (p) {
        const first = !policy;
        policy = p.policy;
        if (first || !$('policy').open) fillPolicy();
      }
      latest = v.version ?? latest;
      say('mine-note', computers.length
        ? 'Signed in on any device, these are here. A computer shows its details once you run `glass fleet on` on it.'
        : 'To add a computer, run `glass account add` on it and open the link here.');
      $('find').classList.toggle('hidden', computers.length < 4);
      drawMine();
    }

    // A link from `glass account add` (#claim=…): kept for this tab until used or dismissed,
    // so creating an account or signing in on the way doesn't lose it.
    function takeClaimFromLink() {
      const fromLink = new URLSearchParams(location.hash.slice(1)).get('claim');
      if (!fromLink) return false;
      try { sessionStorage.setItem('glass.claim', fromLink); } catch {}
      history.replaceState(null, '', location.pathname);
      return true;
    }
    takeClaimFromLink();
    takeManageFromLink();
    addEventListener('hashchange', () => { if (takeClaimFromLink() || takeManageFromLink()) showClaim(); });
    const pendingClaim = () => { try { return sessionStorage.getItem('glass.claim'); } catch { return null; } };
    const dropClaim = () => { try { sessionStorage.removeItem('glass.claim'); } catch {} };

    async function showManage(v) {
      const [hostId, pin] = v.split('.');
      const { computers = [] } = account ? await api('/api/account/computers').catch(() => ({})) : {};
      const c = computers.find((x) => x.id === hostId);
      $('claim-title').textContent = c ? `Let your account manage ${c.name}?` : 'Manage a computer';
      if (!account || !c) {
        $('claim-note').textContent = account ? 'That computer isn\'t on your account. Add it first with `glass account add`, then run `glass fleet manage` again.' : 'Sign in below first, then come back to this link.';
        $('claim-actions').replaceChildren(claimButton(account ? 'OK' : 'Not now', async () => dropManage(), 'quiet'));
        return;
      }
      $('claim-note').textContent = `Anyone signed in to this account will be able to ask ${c.name} to refresh its details, update or restart Glass, restart the computer and run its approved scripts. Each one needs your passkey: your fingerprint, face or PIN. Only do this for a computer you're setting up yourself, now.`;
      $('claim-actions').replaceChildren(
        claimButton('Allow', async () => { await enrollManager(hostId, pin); dropManage(); }, 'primary'),
        claimButton('Not now', async () => dropManage(), 'quiet'),
      );
    }

    async function showClaim() {
      const code = pendingClaim();
      const manage = code ? null : pendingManage();
      $('claim').classList.toggle('hidden', !code && !manage);
      if (manage) return showManage(manage);
      if (!code) return;
      let name;
      try {
        ({ name } = await api(`/api/account/claim?code=${encodeURIComponent(code)}`));
      } catch (e) {
        $('claim-title').textContent = 'This link doesn\'t work';
        $('claim-note').textContent = e.message;
        $('claim-actions').replaceChildren(claimButton('OK', async () => dropClaim()));
        return;
      }
      $('claim-title').textContent = `Add ${name}?`;
      if (!account) {
        $('claim-note').textContent = `Sign in or create an account below, then add ${name} to it.`;
        $('claim-actions').replaceChildren(claimButton('Not now', async () => dropClaim(), 'quiet'));
        return;
      }
      $('claim-note').textContent = 'Only add a computer you\'re setting up yourself, right now: it shows on your account and opens from here.';
      $('claim-actions').replaceChildren(
        claimButton(`Add ${name}`, async () => {
          await api('/api/account/computers', { method: 'POST', body: { claim: code } });
          dropClaim();
        }, 'primary'),
        claimButton('Not now', async () => dropClaim(), 'quiet'),
      );
    }

    function claimButton(text, onClick, kind = '') {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = text;
      if (kind) b.className = kind;
      b.addEventListener('click', async () => {
        for (const other of $('claim-actions').querySelectorAll('button')) other.disabled = true;
        $('claim-status').textContent = '';
        try {
          await onClick();
        } catch (e) {
          $('claim-status').textContent = e.message;
          if (e.status !== 404) {
            for (const other of $('claim-actions').querySelectorAll('button')) other.disabled = false;
            return;
          }
          dropClaim();
        }
        await Promise.all([showClaim(), showMine()]);
      });
      return b;
    }

    const refresh = () => Promise.all([showMine(), showBrowser()]);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
    setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
    showAccount().then(() => Promise.all([showClaim(), showMine()]));
    showBrowser();
  </script>
</body>
</html>
